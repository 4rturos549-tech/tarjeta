<style>
/* VOICE: directo, de desarrollador; una tarjeta que se usa en 5 segundos.
   IDEA: página de enlaces estilo Linktree: foto, nombre y botones grandes.
   PICTURE: fondo azul con cuadrícula, avatar con anillo y una columna de botones.
   COLOUR and TYPE: azul #1240c4 dominante, blanco, coral #ff6b4a de acento; Sora + Inter.
   LAYOUT: una columna centrada de máx. 440px, todo en la primera pantalla del teléfono. */
:root{color-scheme:light dark;--brand:#1240c4;--brand2:#2a5cff;--accent:#ff6b4a;--btn:#ffffff;--btnink:#121826}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:#fff;font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;
background:linear-gradient(170deg,var(--brand2),var(--brand) 55%,#0a2a8f) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:32px 32px}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:44px 20px 32px;text-align:center}
.avatar{position:relative;width:108px;height:108px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 30% 25%,#ffffff40,#ffffff10 60%);border:3px solid #fff;font:700 40px/1 Sora,sans-serif}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{font:700 26px/1.15 Sora,sans-serif;margin:0 0 4px}
.role{margin:0;color:#dfe7ff;font-weight:500}
.meta{margin:4px 0 0;color:#c4d2ff;font-size:14px}
.social{display:flex;justify-content:center;gap:12px;margin:16px 0 22px}
.social a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;color:#fff}
.social a:focus-visible,.link:focus-visible{outline:3px solid #fff;outline-offset:3px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:16px;background:var(--btn);color:var(--btnink);
text-decoration:none;font-weight:600;border:0;width:100%;font:inherit;font-weight:600;cursor:pointer;text-align:left;
box-shadow:0 6px 0 #0a2470;transition:transform .12s,box-shadow .12s}
.link:hover{transform:translateY(2px);box-shadow:0 4px 0 #0a2470}
.link .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#eef2ff;color:var(--brand)}
.link span.t{flex:1}
.link small{display:block;font-weight:400;color:#5b6476;font-size:13px}
.link.hl{background:var(--accent);color:#fff}.link.hl .ic{background:#ffffff33;color:#fff}.link.hl small{color:#ffe3dc}
.link .go{color:#9aa3b5;font-size:22px}.link.hl .go{color:#fff}
.label{margin:22px 0 2px;font-size:13px;color:#c4d2ff;text-align:left}
.cvview{position:relative;max-width:820px;margin:0 auto;padding:12px 12px 32px}
.cvview img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 10px 30px #0006;background:#fff}
.cvbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:10px 4px 14px;color:#fff;font:600 16px Sora,sans-serif}
.cvbar .back{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:#fff;color:#1240c4;text-decoration:none}
footer{margin-top:28px;font-size:13px;color:#c4d2ff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#121826;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.link,.toast{transition:none}}
</style>
</head>

  mail:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.8-2.7-1.1-4.4-3.8-4.6-4-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.5-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
  game:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg>',
  code:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const a = (href, ic, t, sub, hl) => `<a class="link${hl?' hl':''}" href="${esc(href)}" target="_blank" rel="noopener"><span class="ic">${ic}</span><span class="t">${t}<small>${sub}</small></span><span class="go" aria-hidden="true">›</span></a>`;

const L = [];
if (C.portfolio) L.push(a(C.portfolio, I.web, 'Mi portafolio', 'Proyectos, experiencia y skills', true));
if (C.cv) L.push(`<a class="link" href="#cv"><span class="ic">${I.cv}</span><span class="t">Mi CV<small>Ver mi currículum completo</small></span><span class="go" aria-hidden="true">›</span></a>`);
if (C.linkedin) L.push(a(C.linkedin, I.in, 'LinkedIn', 'carlos-llano-flores'));
if (C.github) L.push(a(C.github, I.gh, 'GitHub', 'CarlosFloresDev'));
if (C.whatsapp) L.push(a('https://wa.me/' + C.whatsapp, I.wa, 'WhatsApp', '+' + esc(C.whatsapp)));
L.push(`<button class="link" id="mail" type="button"><span class="ic">${I.mail}</span><span class="t">Email<small>${esc(C.email)} · toca para copiar</small></span><span class="go" aria-hidden="true">›</span></button>`);
document.getElementById('links').innerHTML = L.join('');

I.hw = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>';
I.leaf = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 19c-2-6 2-13 13-14-1 11-8 15-13 14zM4 21l7-7"/></svg>';
const P = [
  [C.portfolio, I.hw, 'BlindForge · guante háptico', 'Accesibilidad para personas con discapacidad visual · ESP32 + Django + Spring Boot + React'],
  ['https://github.com/CarlosFloresDev/tracktrash-mobile', I.leaf, 'TrackTrash', 'App de reciclaje con recojo y puntos de acopio · Flutter + ASP.NET Core + PostgreSQL'],
  ['https://pixelandino.pages.dev', I.web, 'Pixel Andino', 'Agencia web con sitios demo y panel de clientes · Cloudflare']
];
document.getElementById('proj').innerHTML = P.map(p => a(...p)).join('');

const S = [[C.linkedin, I.in, 'LinkedIn'], [C.github, I.gh, 'GitHub'], [C.portfolio, I.web, 'Portafolio']].filter(s => s[0]);
document.getElementById('social').innerHTML = S.map(([h, ic, n]) => `<a href="${esc(h)}" target="_blank" rel="noopener" aria-label="${n}">${ic}</a>`).join('');

if (C.foto) document.getElementById('avatar').innerHTML = `<img src="${esc(C.foto)}" alt="Foto de Carlos Llano">`;

const route = () => { const cv = location.hash === '#cv'; document.getElementById('cvview').hidden = !cv; document.getElementById('home').hidden = cv; window.scrollTo(0,0); };
window.addEventListener('hashchange', route); route();
const toast = document.getElementById('toast');
document.getElementById('mail').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(C.email); toast.textContent = 'Email copiado'; }
  catch (e) { toast.textContent = C.email; }
  toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1800);
});
}
</script>
